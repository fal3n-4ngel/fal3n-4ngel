name: Next.js Website CI

on:
  push:
    branches:
      - release/portfolio
  pull_request:
    branches:
      - release/portfolio

jobs:
  build-and-test:
    name: Type-Check, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Type-Check
        run: npm run type-check

      - name: Run Linter
        run: npm run lint

      - name: Build Next.js Production App
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: "https://www.adithyakrishnan.com"
