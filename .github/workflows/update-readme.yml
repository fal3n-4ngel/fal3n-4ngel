name: Update README

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [master]
  schedule:
    - cron: "0 */12 * * 0,2,4,6"

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate README + stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: node scripts/readme/generate.mjs

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(README): regenerate stats card"
          branch: master
          commit_user_name: fal3n-4ngel
          commit_user_email: adiadithyakrishnan@gmail.com
          commit_author: Adithya Krishnan
          file_pattern: "README.md assets/stats-card.svg"
